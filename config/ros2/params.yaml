chassis_impedance:
  ros__parameters:
    # impedance control work loop rate [hz]
    rate_ros: 1000.0

    # keyboard monitor rate [hz]
    rate_teleop: 1000.0

    # SE(2) impedance gains mapped to body twist [vx, vy, omega]
    # units: [1/s, 1/s, 1/s] * pose error -> [m/s, m/s, rad/s]
    chs_impedance_kp: [200.0, 200.0, 50.0]
    chs_impedance_kd: [5.0, 5.0, 2.0]
    chs_pos_threshold: 1.0
    chs_yaw_threshold: 1.0

    # Maver X4 chassis geometry [m]
    chs_bias: 0.02
    chs_wheel_radius: 0.0625
    chs_track_width: 0.28
    chs_wheel_base: 0.424

